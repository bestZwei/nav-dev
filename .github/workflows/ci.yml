name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      # SKIP_OPEN_NEXT_BUILD=1：CI 只验证 Next.js 构建，跳过 OpenNext 产物处理
      - name: Build
        run: npm run build
        env:
          SKIP_OPEN_NEXT_BUILD: "1"
