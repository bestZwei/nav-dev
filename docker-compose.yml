services:
  # PostgreSQL 数据库
  postgresql:
    image: postgres:15-alpine
    container_name: nav-postgresql
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nav}
      # 密码必填：公开仓库里的默认密码等于全网皆知，必须由 .env 显式提供
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nav}
    volumes:
      - postgresql-data:/var/lib/postgresql/data
    ports:
      # 仅绑定本机回环：数据库无需暴露到所有网卡，应用经内部网络访问
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nav}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - network

  # Next.js 应用
  nav:
    image: ghcr.io/kenanlabs/nav:latest
    container_name: nav
    restart: unless-stopped
    ports:
      - ${PORT:-3000}:3000
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nav}:${POSTGRES_PASSWORD:?请在 .env 中设置 POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB:-nav}
      # 会话签名密钥，未设置时回退 NEXTAUTH_SECRET
      SESSION_SECRET: ${SESSION_SECRET:-${NEXTAUTH_SECRET}}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
      # 初始管理员账号（仅首次 seed 生效）：compose 的 .env 只做变量替换，
      # 不注入容器环境，必须显式透传才能被容器内的 seed 脚本读到
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      NODE_ENV: production
    volumes:
      # 会话密钥兜底文件持久化：未配置 SESSION_SECRET 时，重启/换镜像不会导致全部会话失效
      - nav-session-data:/app/.session-data
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  postgresql-data:
    driver: local
  nav-session-data:
    driver: local

networks:
  network:
    driver: bridge
